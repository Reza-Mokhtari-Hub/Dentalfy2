<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dentalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#dentalGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Tooth Silhouette Background Subtle Ring -->
  <path d="M 256 90 C 310 90, 360 120, 360 180 C 360 230, 330 290, 320 340 C 310 390, 290 420, 275 420 C 265 420, 260 400, 256 390 C 252 400, 247 420, 237 420 C 222 420, 202 390, 192 340 C 182 290, 152 230, 152 180 C 152 120, 202 90, 256 90 Z" 
        fill="none" stroke="url(#dentalGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" />

  <!-- Stylized Monogram "DA" with Dental Tooth Accent -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter 'D' -->
    <path d="M 140 150 L 140 360 M 140 150 L 220 150 C 280 150, 290 200, 290 255 C 290 310, 280 360, 220 360 L 140 360" 
          fill="none" stroke="url(#dentalGrad)" stroke-width="36" />
          
    <!-- Letter 'A' overlay -->
    <path d="M 285 360 L 335 150 L 385 360 M 305 290 L 365 290" 
          fill="none" stroke="#ffffff" stroke-width="32" />
          
    <!-- Medical Dental Sparkle / Tooth Crown Diamond at top of A -->
    <path d="M 335 110 L 343 130 L 363 138 L 343 146 L 335 166 L 327 146 L 307 138 L 327 130 Z" 
          fill="#38bdf8" />
  </g>
</svg>
